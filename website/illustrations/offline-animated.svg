<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="#HAD'JF #HD'K">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .hafiz-motion > animateTransform,
      .arrow animateTransform,
      .cloud animate,
      .bars rect animate {
        display: none;
      }
      .cloud { opacity: 1 !important; }
    }
  </style>
  <!-- Hand-crafted flat illustration matching Hafiz QuiverAI style (generate credits exhausted; animate API unavailable) -->
  <g class="hafiz-motion">
    <animateTransform attributeName="transform" type="translate" values="0 1.2; 0 -1.2; 0 1.2" dur="5.5s" repeatCount="indefinite"/>
    <!-- Device -->
    <rect x="48" y="46" width="64" height="90" rx="10" fill="#145938" stroke="#111C2A" stroke-width="1"/>
    <rect x="54" y="56" width="52" height="68" rx="3" fill="#F6F2E9"/>
    <circle cx="80" cy="132" r="3.5" fill="#C8A856"/>
    <!-- Offline signal bars -->
    <g class="bars" transform="translate(62 66)">
      <rect x="0" y="10" width="5" height="6" rx="1" fill="#145938">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="8" y="6" width="5" height="10" rx="1" fill="#145938">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="2" width="5" height="14" rx="1" fill="#C8A856">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="0" width="5" height="16" rx="1" fill="#C8A856">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- List rows on device -->
    <rect x="60" y="88" width="40" height="6" rx="2" fill="#E5F4EB"/>
    <rect x="60" y="98" width="34" height="6" rx="2" fill="#E5F4EB"/>
    <rect x="60" y="108" width="28" height="6" rx="2" fill="#E5F4EB"/>
    <!-- Cloud -->
    <g class="cloud" opacity="0.95">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      <path d="M70 42c0-8 6.5-14 15-14 5.5 0 10.2 2.8 12.8 7 1.4-.6 3-.9 4.7-.9 7 0 12.5 5.2 12.5 11.5 0 .5 0 1-.1 1.4H66.8c-4.8-.4-8.8-4.3-8.8-9 0-5 4-9 9-9 1.1 0 2.1.2 3.1.5C71.2 33.2 70 37.3 70 42z" fill="#E5F4EB" stroke="#111C2A" stroke-width="1"/>
    </g>
    <!-- Sync upload arrow loop -->
    <g class="arrow" transform="translate(80 28)">
      <animateTransform attributeName="transform" type="translate" values="80 30; 80 18; 80 30" dur="2.2s" repeatCount="indefinite"/>
      <path d="M0 16v-12" fill="none" stroke="#C8A856" stroke-width="3" stroke-linecap="round"/>
      <path d="M-6 8l6-8 6 8" fill="none" stroke="#C8A856" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
